services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slowtalk
      POSTGRES_USER: slowtalk
      POSTGRES_PASSWORD: slowtalk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slowtalk"]
      interval: 5s
      timeout: 5s
      retries: 10
